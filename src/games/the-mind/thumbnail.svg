<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- 배경: 파스텔 청록→연노랑 그라데이션 -->
  <defs>
    <linearGradient id="tmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddf2ef"/>
      <stop offset="1" stop-color="#fff8e1"/>
    </linearGradient>
    <filter id="tmlift" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3a6b63" flood-opacity="0.26"/></filter>
  </defs>
  <rect width="320" height="200" rx="22" fill="url(#tmbg)"/>

  <!-- 배경 데코: 작은 점들 -->
  <circle cx="26" cy="30" r="3" fill="#c5e8e1"/>
  <circle cx="292" cy="34" r="2.5" fill="#ffeeb8"/>
  <circle cx="288" cy="172" r="3" fill="#8ccfc6"/>
  <circle cx="32" cy="172" r="2.2" fill="#c5e8e1"/>

  <!-- 작은 별 데코 -->
  <path d="M 46,44 L 48,49 L 53,49 L 49,52 L 51,57 L 46,54 L 41,57 L 43,52 L 39,49 L 44,49 Z"
        fill="#c5e8e1" opacity="0.7"/>
  <path d="M 276,146 L 278,151 L 283,151 L 279,154 L 281,159 L 276,156 L 271,159 L 273,154 L 269,151 L 274,151 Z"
        fill="#ffeeb8" opacity="0.7"/>

  <g filter="url(#tmlift)">
    <!-- 이미 나온 카드 두 장 (작게, 뒤에) -->
    <g transform="translate(44, 78) rotate(-9)">
      <rect x="0" y="0" width="54" height="74" rx="11" fill="#ffffff" stroke="#8ccfc6" stroke-width="2.5"/>
      <g font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif"
         font-size="27" font-weight="900" text-anchor="middle">
        <text x="27" y="47" fill="#8ccfc6">14</text>
      </g>
    </g>
    <g transform="translate(96, 70) rotate(-3)">
      <rect x="0" y="0" width="58" height="78" rx="12" fill="#ffffff" stroke="#3fb3a2" stroke-width="2.5"/>
      <g font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif"
         font-size="30" font-weight="900" text-anchor="middle">
        <text x="29" y="50" fill="#3fb3a2">38</text>
      </g>
    </g>

    <!-- 지금 낼까 말까 하는 카드 (앞, 크게, 살짝 들린 채) -->
    <g transform="translate(158, 48) rotate(7)">
      <rect x="0" y="0" width="78" height="104" rx="15" fill="#ffffff" stroke="#2a9488" stroke-width="3.5"/>
      <g font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif"
         font-size="42" font-weight="900" text-anchor="middle">
        <text x="39" y="68" fill="#2f4a46">41</text>
      </g>
    </g>
  </g>

  <!-- 보조: 생명 하트 셋 (좌상단) -->
  <g transform="translate(24, 92)" opacity="0.95">
    <path d="M9 15.5S2 11.6 2 7.4A3.6 3.6 0 0 1 9 5.2A3.6 3.6 0 0 1 16 7.4C16 11.6 9 15.5 9 15.5Z" fill="#c23a46"/>
    <path d="M9 37.5S2 33.6 2 29.4A3.6 3.6 0 0 1 9 27.2A3.6 3.6 0 0 1 16 29.4C16 33.6 9 37.5 9 37.5Z" fill="#c23a46"/>
    <path d="M9 59.5S2 55.6 2 51.4A3.6 3.6 0 0 1 9 49.2A3.6 3.6 0 0 1 16 51.4C16 55.6 9 59.5 9 59.5Z" fill="#edc3c7"/>
  </g>

  <!-- 보조: 수리검 배지 (우하단, 비스듬히) -->
  <g transform="translate(248, 112) rotate(-14)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#e8c96a" stroke-width="2.5"/>
    <path d="M 16,5 L 18.8,12.6 L 27,13 L 20.6,18.1 L 22.8,26 L 16,21.6 L 9.2,26 L 11.4,18.1 L 5,13 L 13.2,12.6 Z"
          fill="#f5c33d"/>
  </g>

  <!-- 보조: 조용히 하라는 점 세 개 (말 없는 게임) -->
  <g transform="translate(44, 168)" fill="#8ccfc6">
    <circle cx="0" cy="0" r="3.4"/>
    <circle cx="14" cy="0" r="3.4"/>
    <circle cx="28" cy="0" r="3.4"/>
  </g>
</svg>
