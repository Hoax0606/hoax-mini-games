<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="algagiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4ee"/>
      <stop offset="100%" stop-color="#e0fff4"/>
    </linearGradient>
    <!-- 소프트 입체: 중앙 일러스트 드롭섀도 -->
    <filter id="lift" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8a5a78" flood-opacity="0.26"/></filter>
  </defs>

  <!-- 배경 라운드 사각 -->
  <rect x="0" y="0" width="320" height="200" rx="22" fill="url(#algagiBg)"/>

  <!-- 모서리 점 데코 -->
  <circle cx="26" cy="28" r="3" fill="#ff6b9e" opacity="0.55"/>
  <circle cx="296" cy="32" r="3" fill="#86e8c4" opacity="0.6"/>
  <circle cx="28" cy="174" r="2.5" fill="#b89aff" opacity="0.55"/>
  <circle cx="294" cy="172" r="3.5" fill="#ffeec2" opacity="0.7"/>

  <!-- 별 데코 -->
  <path d="M 50 50 l 1.6 4 4.4 0.4 -3.4 2.8 1 4.3 -3.6 -2.4 -3.6 2.4 1 -4.3 -3.4 -2.8 4.4 -0.4 z"
        fill="#ff82ac" opacity="0.7"/>
  <path d="M 268 150 l 1.4 3.5 3.8 0.3 -3 2.5 0.9 3.7 -3.1 -2.1 -3.1 2.1 0.9 -3.7 -3 -2.5 3.8 -0.3 z"
        fill="#86e8c4" opacity="0.7"/>

  <!-- 소프트 입체: 중앙 일러스트 드롭섀도 -->
  <g filter="url(#lift)">
  <!-- 바둑판 (중앙, 살짝 기울어진 느낌은 안 줌) -->
  <g transform="translate(96, 36)">
    <!-- 보드 바깥 (절벽 외곽 — 짙은 라벤더) -->
    <rect x="-3" y="-3" width="134" height="134" rx="6" fill="#6e5872"/>
    <!-- 보드 안 (크림) -->
    <rect x="0" y="0" width="128" height="128" rx="3" fill="#fff9e8"/>
    <!-- 격자 9 분할 (옅은 라인) -->
    <g stroke="rgba(110, 88, 114, 0.28)" stroke-width="1" fill="none">
      <line x1="14.2" y1="0" x2="14.2" y2="128"/>
      <line x1="28.4" y1="0" x2="28.4" y2="128"/>
      <line x1="42.6" y1="0" x2="42.6" y2="128"/>
      <line x1="56.8" y1="0" x2="56.8" y2="128"/>
      <line x1="71"   y1="0" x2="71"   y2="128"/>
      <line x1="85.2" y1="0" x2="85.2" y2="128"/>
      <line x1="99.4" y1="0" x2="99.4" y2="128"/>
      <line x1="113.6" y1="0" x2="113.6" y2="128"/>
      <line x1="0" y1="14.2" x2="128" y2="14.2"/>
      <line x1="0" y1="28.4" x2="128" y2="28.4"/>
      <line x1="0" y1="42.6" x2="128" y2="42.6"/>
      <line x1="0" y1="56.8" x2="128" y2="56.8"/>
      <line x1="0" y1="71"   x2="128" y2="71"/>
      <line x1="0" y1="85.2" x2="128" y2="85.2"/>
      <line x1="0" y1="99.4" x2="128" y2="99.4"/>
      <line x1="0" y1="113.6" x2="128" y2="113.6"/>
    </g>
    <!-- 별점 (화점) -->
    <circle cx="42.6" cy="42.6" r="1.8" fill="rgba(110, 88, 114, 0.55)"/>
    <circle cx="85.2" cy="42.6" r="1.8" fill="rgba(110, 88, 114, 0.55)"/>
    <circle cx="42.6" cy="85.2" r="1.8" fill="rgba(110, 88, 114, 0.55)"/>
    <circle cx="85.2" cy="85.2" r="1.8" fill="rgba(110, 88, 114, 0.55)"/>
    <circle cx="64" cy="64" r="1.8" fill="rgba(110, 88, 114, 0.55)"/>

    <!-- 알들 -->
    <!-- 민트 알 (호스트) — 상단 줄 -->
    <g>
      <circle cx="35" cy="110" r="9" fill="#6ed9b3" stroke="#2e8a70" stroke-width="1"/>
      <path d="M 27 105 a 8 8 0 0 1 16 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <circle cx="64" cy="110" r="9" fill="#6ed9b3" stroke="#2e8a70" stroke-width="1"/>
      <path d="M 56 105 a 8 8 0 0 1 16 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <circle cx="93" cy="110" r="9" fill="#6ed9b3" stroke="#2e8a70" stroke-width="1"/>
      <path d="M 85 105 a 8 8 0 0 1 16 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none"/>
    </g>

    <!-- 핑크 알 (게스트) — 상단 줄 -->
    <g>
      <circle cx="35" cy="22" r="9" fill="#ff6b9e" stroke="#c93d73" stroke-width="1"/>
      <path d="M 27 17 a 8 8 0 0 1 16 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none"/>
    </g>
    <g>
      <circle cx="64" cy="22" r="9" fill="#ff6b9e" stroke="#c93d73" stroke-width="1"/>
      <path d="M 56 17 a 8 8 0 0 1 16 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none"/>
    </g>
    <!-- 튕긴 핑크 알 — 살짝 어긋난 위치 + 운동선 -->
    <g transform="translate(93, 22) rotate(-12)">
      <circle cx="0" cy="0" r="9" fill="#ff6b9e" stroke="#c93d73" stroke-width="1"/>
      <path d="M -8 -5 a 8 8 0 0 1 16 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none"/>
    </g>
    <!-- 운동 선 (튕긴 자국) -->
    <path d="M 110 25 q -8 4 -16 -2" stroke="#c93d73" stroke-width="1.4" fill="none" stroke-dasharray="3 3" opacity="0.55"/>
  </g>

  <!-- 좌측 보조 일러스트 — 살짝 기울어진 민트 알 (영역 밖에서 들어오는 느낌) -->
  <g transform="translate(60, 96) rotate(-18)">
    <circle cx="0" cy="0" r="10" fill="#6ed9b3" stroke="#2e8a70" stroke-width="1.2"/>
    <path d="M -9 -5 a 9 9 0 0 1 18 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" fill="none"/>
  </g>

  <!-- 우측 보조 일러스트 — 작은 핑크 알 -->
  <g transform="translate(258, 110) rotate(14)">
    <circle cx="0" cy="0" r="8" fill="#ff6b9e" stroke="#c93d73" stroke-width="1"/>
    <path d="M -7 -4 a 7 7 0 0 1 14 0" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none"/>
  </g>
  </g>
</svg>
