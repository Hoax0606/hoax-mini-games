<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4ee"/>
      <stop offset="1" stop-color="#e0fff4"/>
    </linearGradient>
    <radialGradient id="bwBomb" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#5c5468"/>
      <stop offset="1" stop-color="#2e2838"/>
    </radialGradient>
  </defs>

  <rect width="320" height="200" rx="22" fill="url(#bwBg)"/>

  <!-- 배경 데코 4개 점 -->
  <circle cx="30" cy="30" r="3" fill="#ffc9dd"/>
  <circle cx="290" cy="40" r="2.5" fill="#b8f5e0"/>
  <circle cx="290" cy="170" r="3" fill="#d9c7ff"/>
  <circle cx="30" cy="170" r="2.2" fill="#ffeec2"/>

  <!-- 별 데코 2개 -->
  <path d="M 54 60 L 56 66 L 62 66 L 57.2 69.8 L 59 75.6 L 54 72 L 49 75.6 L 50.8 69.8 L 46 66 L 52 66 Z"
        fill="#ffd0dc" opacity="0.85"/>
  <path d="M 272 132 L 274 137 L 279 137 L 275 140.2 L 276.5 145 L 272 142 L 267.5 145 L 269 140.2 L 265 137 L 270 137 Z"
        fill="#c5e8d8" opacity="0.85"/>

  <!-- 단어 말풍선들 (돌아가는 끝말잇기 암시) -->
  <g font-family="Pretendard, system-ui, sans-serif" font-weight="800">
    <g transform="translate(64 96)">
      <rect x="-30" y="-16" width="60" height="30" rx="12" fill="#ffffff" stroke="#ffc9dd" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" fill="#4a3a4a">사과</text>
    </g>
    <g transform="translate(250 104)">
      <rect x="-30" y="-16" width="60" height="30" rx="12" fill="#ffffff" stroke="#b8f5e0" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-size="16" fill="#4a3a4a">과일</text>
    </g>
  </g>

  <!-- 도는 화살표 -->
  <path d="M 96 118 Q 160 150 224 118" fill="none" stroke="#9c7aeb" stroke-width="3"
        stroke-dasharray="6 5" stroke-linecap="round"/>
  <path d="M 224 118 l -10 -2 l 5 9 z" fill="#9c7aeb"/>

  <!-- 중앙 폭탄 -->
  <g transform="translate(160 96)">
    <!-- 도화선 -->
    <path d="M 6 -34 Q 22 -50 12 -66" fill="none" stroke="#c99a5a" stroke-width="4" stroke-linecap="round"/>
    <!-- 스파크 -->
    <circle cx="12" cy="-66" r="7" fill="#ffb845"/>
    <circle cx="12" cy="-66" r="3.5" fill="#ff5a92"/>
    <!-- 몸통 -->
    <circle r="34" fill="url(#bwBomb)"/>
    <!-- 심지 꼭지 -->
    <rect x="-5" y="-40" width="10" height="10" rx="2" fill="#2e2838"/>
    <!-- 하이라이트 -->
    <ellipse cx="-11" cy="-11" rx="7" ry="9" fill="rgba(255,255,255,0.28)"/>
  </g>
</svg>
