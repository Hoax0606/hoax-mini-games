<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4ee"/>
      <stop offset="1" stop-color="#e0fff4"/>
    </linearGradient>
    <linearGradient id="bmBoard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#ffeef5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="200" rx="22" fill="url(#bmBg)"/>
  <!-- 데코 점 -->
  <circle cx="28" cy="30" r="5" fill="#ffc9dd"/>
  <circle cx="296" cy="34" r="4" fill="#bfe9ff"/>
  <circle cx="26" cy="170" r="4" fill="#c7f0dc"/>
  <circle cx="298" cy="168" r="5" fill="#e6d4ff"/>
  <!-- 별 데코 -->
  <path d="M250 44 l3 6 6 1 -4 5 1 6 -6 -3 -6 3 1 -6 -4 -5 6 -1z" fill="#ffd4e6"/>
  <path d="M62 150 l2 5 5 1 -3 4 1 5 -5 -3 -5 3 1 -5 -3 -4 5 -1z" fill="#cdeffb"/>

  <!-- 보드(살짝 회전) -->
  <g transform="rotate(-8 160 104)">
    <rect x="98" y="42" width="124" height="124" rx="14" fill="url(#bmBoard)" stroke="#f0d8e6" stroke-width="2"/>
    <!-- 둘레 칸 색 -->
    <g>
      <rect x="102" y="46" width="20" height="16" rx="3" fill="#ff9bbb"/>
      <rect x="150" y="46" width="20" height="16" rx="3" fill="#ffb27a"/>
      <rect x="198" y="46" width="20" height="16" rx="3" fill="#f2d24c"/>
      <rect x="202" y="102" width="16" height="20" rx="3" fill="#8fe0b0"/>
      <rect x="202" y="146" width="16" height="16" rx="3" fill="#8fc2f0"/>
      <rect x="150" y="150" width="20" height="12" rx="3" fill="#e79ad0"/>
      <rect x="102" y="146" width="16" height="16" rx="3" fill="#7fd6d0"/>
      <rect x="102" y="102" width="16" height="20" rx="3" fill="#b89aff"/>
    </g>
    <!-- 중앙 로고 -->
    <text x="160" y="100" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" font-weight="900" fill="#5b9be6">BLUE</text>
    <text x="160" y="120" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="17" font-weight="900" fill="#ff5a92">MARBLE</text>
  </g>

  <!-- 주사위 2개 -->
  <g transform="rotate(10 232 150)">
    <rect x="214" y="132" width="30" height="30" rx="7" fill="#fff" stroke="#c9b7d6" stroke-width="2"/>
    <circle cx="223" cy="141" r="2.6" fill="#ff5a92"/><circle cx="235" cy="141" r="2.6" fill="#ff5a92"/>
    <circle cx="223" cy="153" r="2.6" fill="#ff5a92"/><circle cx="235" cy="153" r="2.6" fill="#ff5a92"/>
  </g>
  <g transform="rotate(-6 258 158)">
    <rect x="246" y="146" width="26" height="26" rx="6" fill="#fff" stroke="#c9b7d6" stroke-width="2"/>
    <circle cx="259" cy="159" r="2.4" fill="#5b9be6"/>
  </g>

  <!-- 말(구슬) 2개 -->
  <circle cx="70" cy="62" r="10" fill="#6ed9b3" stroke="#fff" stroke-width="2.5"/>
  <circle cx="66" cy="58" r="3" fill="#fff" opacity="0.75"/>
  <circle cx="60" cy="90" r="9" fill="#ffd454" stroke="#fff" stroke-width="2.5"/>
  <circle cx="56.5" cy="86.5" r="2.6" fill="#fff" opacity="0.75"/>
