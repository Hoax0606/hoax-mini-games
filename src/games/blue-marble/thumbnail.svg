<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4ee"/><stop offset="1" stop-color="#e0fff4"/>
    </linearGradient>
    <linearGradient id="bmBoard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#fff2f8"/>
    </linearGradient>
    <filter id="bmLift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#8a5a78" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="0" y="0" width="320" height="200" rx="22" fill="url(#bmBg)"/>
  <circle cx="28" cy="30" r="5" fill="#ffc9dd"/>
  <circle cx="296" cy="34" r="4" fill="#bfe9ff"/>
  <circle cx="26" cy="170" r="4" fill="#c7f0dc"/>
  <circle cx="298" cy="168" r="5" fill="#e6d4ff"/>
  <path d="M256 40 l2.4 5 5.2 .5 -4 3.6 1.2 5.2 -4.8 -2.8 -4.8 2.8 1.2 -5.2 -4 -3.6 5.2 -.5z" fill="#ffd4e6"/>
  <path d="M42 148 l2 4 4.4 .4 -3.4 3 1 4.4 -4 -2.4 -4 2.4 1 -4.4 -3.4 -3 4.4 -.4z" fill="#cdeffb"/>

  <!-- 보드(살짝 회전) -->
  <g filter="url(#bmLift)" transform="rotate(-7 158 102)">
    <rect x="96" y="40" width="124" height="124" rx="14" fill="url(#bmBoard)" stroke="#f0d8e6" stroke-width="2"/>
    <!-- 둘레 그룹색 칸 -->
    <g>
      <rect x="100" y="44" width="22" height="15" rx="3" fill="#ff9bbb"/>
      <rect x="146" y="44" width="22" height="15" rx="3" fill="#ffb27a"/>
      <rect x="192" y="44" width="24" height="15" rx="3" fill="#f2d24c"/>
      <rect x="201" y="100" width="15" height="20" rx="3" fill="#8fe0b0"/>
      <rect x="201" y="145" width="15" height="15" rx="3" fill="#8fc2f0"/>
      <rect x="146" y="149" width="22" height="11" rx="3" fill="#e79ad0"/>
      <rect x="100" y="145" width="15" height="15" rx="3" fill="#7fd6d0"/>
      <rect x="100" y="100" width="15" height="20" rx="3" fill="#b89aff"/>
    </g>
    <!-- 로고 -->
    <text x="158" y="98" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="900" fill="#5b9be6">BLUE</text>
    <text x="158" y="117" text-anchor="middle" font-family="'Pretendard',sans-serif" font-size="16" font-weight="900" fill="#ff5a92">MARBLE</text>
    <!-- 랜드마크(타워) 한 칸 위에 -->
    <g transform="translate(207,36) scale(0.9)">
      <path d="M6 1 L9 6 H3 Z" fill="#ffd454" stroke="#fff" stroke-width="0.8" stroke-linejoin="round"/>
      <rect x="3" y="6" width="6" height="12" fill="#b89aff" stroke="#fff" stroke-width="1"/>
      <rect x="3" y="6" width="6" height="2.4" fill="#ffd454"/>
      <rect x="1" y="15.5" width="10" height="2.5" fill="#9c7aeb"/>
    </g>
  </g>

  <!-- 주사위 2개 -->
  <g filter="url(#bmLift)" transform="rotate(9 236 150)">
    <rect x="220" y="134" width="30" height="30" rx="7" fill="#fff" stroke="#c9b7d6" stroke-width="2"/>
    <circle cx="229" cy="143" r="2.6" fill="#ff5a92"/><circle cx="241" cy="143" r="2.6" fill="#ff5a92"/>
    <circle cx="229" cy="155" r="2.6" fill="#ff5a92"/><circle cx="241" cy="155" r="2.6" fill="#ff5a92"/>
  </g>
  <g filter="url(#bmLift)" transform="rotate(-6 262 160)">
    <rect x="250" y="148" width="25" height="25" rx="6" fill="#fff" stroke="#c9b7d6" stroke-width="2"/>
    <circle cx="262.5" cy="160.5" r="2.4" fill="#5b9be6"/>
  </g>

  <!-- 구슬 말 -->
  <circle cx="66" cy="60" r="11" fill="#6ed9b3" stroke="#fff" stroke-width="2.5"/>
  <circle cx="62" cy="56" r="3.2" fill="#fff" opacity="0.75"/>
  <circle cx="56" cy="92" r="9.5" fill="#ff5a92" stroke="#fff" stroke-width="2.5"/>
  <circle cx="52.5" cy="88.5" r="2.8" fill="#fff" opacity="0.7"/>
</svg>
