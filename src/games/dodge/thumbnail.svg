<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="ddBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4ee"/>
      <stop offset="100%" stop-color="#e0fff4"/>
    </linearGradient>
    <!-- 소프트 입체: 중앙 일러스트 드롭섀도 -->
    <filter id="lift" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8a5a78" flood-opacity="0.26"/></filter>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="320" height="200" rx="22" fill="url(#ddBg)"/>

  <!-- 모서리 점 데코 -->
  <circle cx="24" cy="24" r="3" fill="#ff6b9e" opacity="0.55"/>
  <circle cx="298" cy="28" r="3.5" fill="#86e8c4" opacity="0.6"/>
  <circle cx="26" cy="176" r="2.5" fill="#b89aff" opacity="0.55"/>
  <circle cx="296" cy="172" r="3" fill="#ffeec2" opacity="0.7"/>

  <!-- 별 데코 -->
  <path d="M 250 30 l 1.6 4 4.4 0.4 -3.4 2.8 1 4.3 -3.6 -2.4 -3.6 2.4 1 -4.3 -3.4 -2.8 4.4 -0.4 z"
        fill="#ff82ac" opacity="0.7"/>
  <path d="M 40 150 l 1.4 3.5 3.8 0.3 -3 2.5 0.9 3.7 -3.1 -2.1 -3.1 2.1 0.9 -3.7 -3 -2.5 3.8 -0.3 z"
        fill="#86e8c4" opacity="0.7"/>

  <!-- 소프트 입체: 중앙 일러스트 드롭섀도 -->
  <g filter="url(#lift)">
  <!-- 떨어지는 똥 3개 (갈색 소용돌이 + 낙하 모션선) -->
  <!-- 낙하 모션선 -->
  <line x1="96" y1="24" x2="96" y2="44" stroke="#c49a1f" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="168" y1="16" x2="168" y2="40" stroke="#c49a1f" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="232" y1="30" x2="232" y2="50" stroke="#c49a1f" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <g stroke="#7a5230" stroke-width="2.5" stroke-linejoin="round">
    <!-- 똥 1 -->
    <path d="M 88 70 q -10 0 -8 -9 q -6 -6 2 -10 q 0 -9 10 -9 q 8 -2 10 7 q 9 1 6 10 q 5 7 -4 11 z" fill="#a9744a"/>
    <!-- 똥 2 (가운데, 큼) -->
    <path d="M 156 60 q -12 0 -10 -11 q -7 -7 3 -12 q 0 -11 12 -11 q 10 -2 12 8 q 11 1 7 12 q 6 8 -5 13 z" fill="#8b5a2b"/>
    <!-- 똥 3 -->
    <path d="M 224 74 q -10 0 -8 -9 q -6 -6 2 -10 q 0 -9 10 -9 q 8 -2 10 7 q 9 1 6 10 q 5 7 -4 11 z" fill="#a9744a"/>
  </g>

  <!-- 캐릭터 (하단 중앙, 위 올려다보며 피하는 중) — 산리오풍 파스텔 블롭 + 대시 잔상 -->
  <!-- 대시 잔상 (오른쪽으로 휙) -->
  <g opacity="0.25">
    <rect x="118" y="140" width="40" height="42" rx="16" fill="#6ed9b3"/>
  </g>
  <g opacity="0.45">
    <rect x="130" y="140" width="40" height="42" rx="16" fill="#6ed9b3"/>
  </g>
  <!-- 본체 -->
  <g>
    <rect x="144" y="138" width="46" height="46" rx="18" fill="#86e8c4" stroke="#2e8a70" stroke-width="2.5"/>
    <!-- 발 -->
    <ellipse cx="156" cy="185" rx="6" ry="3.5" fill="#2e8a70"/>
    <ellipse cx="178" cy="185" rx="6" ry="3.5" fill="#2e8a70"/>
    <!-- 눈 (위 올려다봄) -->
    <circle cx="160" cy="153" r="3.4" fill="#1c1820"/>
    <circle cx="174" cy="153" r="3.4" fill="#1c1820"/>
    <!-- 땀방울 (긴장) -->
    <path d="M 186 150 q 3 5 0 7 q -3 -2 0 -7 z" fill="#5b9cff"/>
  </g>
  </g>
</svg>
