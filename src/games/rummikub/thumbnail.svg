<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="rkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddf2ef"/>
      <stop offset="1" stop-color="#fff8e1"/>
    </linearGradient>
    <filter id="rkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#3a6b63" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="320" height="200" rx="22" fill="url(#rkBg)"/>

  <!-- 점 데코 -->
  <circle cx="30" cy="30" r="5" fill="#c5e8e1"/>
  <circle cx="292" cy="26" r="4" fill="#ffeeb8"/>
  <circle cx="26" cy="172" r="4" fill="#ffeeb8"/>
  <circle cx="294" cy="170" r="5" fill="#8ccfc6"/>

  <!-- 별 데코 -->
  <path d="M60 46l2.6 5.6 6.1.7-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.7z" fill="#ffd978"/>
  <path d="M268 142l2.1 4.5 4.9.6-3.7 3.3 1 4.8-4.3-2.5-4.3 2.5 1-4.8-3.7-3.3 4.9-.6z" fill="#a8ded6"/>

  <!-- 보조: 왼쪽 위 작은 그룹 (같은 숫자 다른 색) -->
  <g filter="url(#rkShadow)" transform="translate(32,58) rotate(-9)">
    <rect x="0" y="0" width="24" height="32" rx="5" fill="#fffdf6" stroke="#e4dcc8" stroke-width="1.6"/>
    <text x="12" y="23" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="800" fill="#d3392f" text-anchor="middle">9</text>
    <rect x="26" y="0" width="24" height="32" rx="5" fill="#fffdf6" stroke="#e4dcc8" stroke-width="1.6"/>
    <text x="38" y="23" font-family="Pretendard, system-ui, sans-serif" font-size="17" font-weight="800" fill="#2563c9" text-anchor="middle">9</text>
  </g>

  <!-- 중앙: 런 (같은 색 연속) + 조커 -->
  <g filter="url(#rkShadow)" transform="translate(96,66)">
    <rect x="0" y="0" width="30" height="42" rx="7" fill="#fffdf6" stroke="#e4dcc8" stroke-width="2"/>
    <text x="15" y="30" font-family="Pretendard, system-ui, sans-serif" font-size="23" font-weight="900" fill="#e0790d" text-anchor="middle">5</text>
    <rect x="34" y="0" width="30" height="42" rx="7" fill="#fffdf6" stroke="#e4dcc8" stroke-width="2"/>
    <text x="49" y="30" font-family="Pretendard, system-ui, sans-serif" font-size="23" font-weight="900" fill="#e0790d" text-anchor="middle">6</text>
    <rect x="68" y="0" width="30" height="42" rx="7" fill="#fffdf6" stroke="#e4dcc8" stroke-width="2"/>
    <text x="83" y="30" font-family="Pretendard, system-ui, sans-serif" font-size="23" font-weight="900" fill="#e0790d" text-anchor="middle">7</text>
    <rect x="102" y="0" width="30" height="42" rx="7" fill="#fffdf6" stroke="#ffd978" stroke-width="2.4"/>
    <text x="117" y="31" font-family="Pretendard, system-ui, sans-serif" font-size="24" font-weight="900" fill="#b8860b" text-anchor="middle">★</text>
  </g>

  <!-- 아래: 손패 느낌으로 살짝 겹친 타일들 -->
  <g filter="url(#rkShadow)" transform="translate(104,124) rotate(4)">
    <rect x="0" y="0" width="26" height="36" rx="6" fill="#fffdf6" stroke="#e4dcc8" stroke-width="1.8"/>
    <text x="13" y="26" font-family="Pretendard, system-ui, sans-serif" font-size="19" font-weight="900" fill="#3a3a3a" text-anchor="middle">11</text>
    <rect x="22" y="-3" width="26" height="36" rx="6" fill="#fffdf6" stroke="#e4dcc8" stroke-width="1.8"/>
    <text x="35" y="23" font-family="Pretendard, system-ui, sans-serif" font-size="19" font-weight="900" fill="#d3392f" text-anchor="middle">3</text>
    <rect x="44" y="0" width="26" height="36" rx="6" fill="#fffdf6" stroke="#e4dcc8" stroke-width="1.8"/>
    <text x="57" y="26" font-family="Pretendard, system-ui, sans-serif" font-size="19" font-weight="900" fill="#2563c9" text-anchor="middle">8</text>
  </g>

  <!-- 보조: 오른쪽 아래 기울어진 타일 -->
  <g filter="url(#rkShadow)" transform="translate(236,96) rotate(12)">
    <rect x="0" y="0" width="26" height="36" rx="6" fill="#fffdf6" stroke="#e4dcc8" stroke-width="1.8"/>
    <text x="13" y="26" font-family="Pretendard, system-ui, sans-serif" font-size="19" font-weight="900" fill="#2563c9" text-anchor="middle">13</text>
  </g>
</svg>
