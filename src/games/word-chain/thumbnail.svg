<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="wcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4ee"/>
      <stop offset="100%" stop-color="#e0fff4"/>
    </linearGradient>
    <!-- 소프트 입체: 중앙 일러스트 드롭섀도 -->
    <filter id="lift" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#8a5a78" flood-opacity="0.26"/></filter>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="320" height="200" rx="22" fill="url(#wcBg)"/>

  <!-- 모서리 점 데코 -->
  <circle cx="22" cy="22" r="3" fill="#ff6b9e" opacity="0.55"/>
  <circle cx="298" cy="26" r="3.5" fill="#86e8c4" opacity="0.6"/>
  <circle cx="24" cy="176" r="2.5" fill="#b89aff" opacity="0.55"/>
  <circle cx="296" cy="172" r="3" fill="#ffeec2" opacity="0.7"/>

  <!-- 별 데코 -->
  <path d="M 40 156 l 1.4 3.5 3.8 0.3 -3 2.5 0.9 3.7 -3.1 -2.1 -3.1 2.1 0.9 -3.7 -3 -2.5 3.8 -0.3 z"
        fill="#ff82ac" opacity="0.7"/>
  <path d="M 282 50 l 1.4 3.5 3.8 0.3 -3 2.5 0.9 3.7 -3.1 -2.1 -3.1 2.1 0.9 -3.7 -3 -2.5 3.8 -0.3 z"
        fill="#86e8c4" opacity="0.7"/>

  <!-- 5장 카드 zig-zag 체인: 사과(핑크) → 과학(민트) → 학교(라벤더) → 교실(노랑) → 실내(하늘) -->

  <!-- 소프트 입체: 중앙 일러스트 드롭섀도 -->
  <g filter="url(#lift)">
  <!-- 카드 1: 사과 (핑크) -->
  <g transform="translate(40, 68) rotate(-8)">
    <rect x="-26" y="-18" width="52" height="36" rx="8" fill="#fff" stroke="#ff82ac" stroke-width="1.8"/>
    <text x="0" y="2" text-anchor="middle" dominant-baseline="middle"
          font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
          font-size="18" font-weight="900" fill="#4a3a4a">사과</text>
  </g>

  <!-- 화살표 1 -->
  <path d="M 73 80 q 12 18 28 24" stroke="#ff5a92" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- 카드 2: 과학 (민트) -->
  <g transform="translate(118, 122) rotate(6)">
    <rect x="-26" y="-18" width="52" height="36" rx="8" fill="#fff" stroke="#6ed9b3" stroke-width="1.8"/>
    <text x="0" y="2" text-anchor="middle" dominant-baseline="middle"
          font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
          font-size="18" font-weight="900" fill="#4a3a4a">과학</text>
  </g>

  <!-- 화살표 2 -->
  <path d="M 148 116 q 14 -16 28 -22" stroke="#2e8a70" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- 카드 3: 학교 (라벤더) - 중앙 -->
  <g transform="translate(192, 76) rotate(-5)">
    <rect x="-26" y="-18" width="52" height="36" rx="8" fill="#fff" stroke="#b89aff" stroke-width="1.8"/>
    <text x="0" y="2" text-anchor="middle" dominant-baseline="middle"
          font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
          font-size="18" font-weight="900" fill="#4a3a4a">학교</text>
  </g>

  <!-- 화살표 3 -->
  <path d="M 222 86 q 12 18 28 22" stroke="#7a5fc7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- 카드 4: 교실 (노랑) -->
  <g transform="translate(264, 124) rotate(7)">
    <rect x="-26" y="-18" width="52" height="36" rx="8" fill="#fff" stroke="#ffc94a" stroke-width="1.8"/>
    <text x="0" y="2" text-anchor="middle" dominant-baseline="middle"
          font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
          font-size="18" font-weight="900" fill="#4a3a4a">교실</text>
  </g>

  <!-- 작은 미니 카드들 (배경, 다인 느낌) -->
  <g transform="translate(86, 30) rotate(-14)" opacity="0.55">
    <rect x="-20" y="-12" width="40" height="24" rx="6" fill="#fff" stroke="#86c9ff" stroke-width="1.4"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle"
          font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
          font-size="12" font-weight="800" fill="#4a3a4a">실내</text>
  </g>

  <g transform="translate(232, 170) rotate(12)" opacity="0.55">
    <rect x="-20" y="-12" width="40" height="24" rx="6" fill="#fff" stroke="#ff6b9e" stroke-width="1.4"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle"
          font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
          font-size="12" font-weight="800" fill="#4a3a4a">내일</text>
  </g>
  </g>
</svg>
