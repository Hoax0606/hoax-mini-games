<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- 배경: 파스텔 핑크→민트 그라데이션 (프로젝트 썸네일 공통 톤) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4ee"/>
      <stop offset="1" stop-color="#e0fff4"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fa"/>
      <stop offset="1" stop-color="#c3cedd"/>
    </linearGradient>
    <filter id="lift" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5a6a8a" flood-opacity="0.26"/></filter>
  </defs>
  <rect width="320" height="200" rx="22" fill="url(#bg)"/>

  <!-- 배경 데코: 점 -->
  <circle cx="30" cy="28" r="3" fill="#ffc9dd"/>
  <circle cx="292" cy="38" r="2.5" fill="#b8f5e0"/>
  <circle cx="296" cy="172" r="3" fill="#d9c7ff"/>
  <circle cx="28" cy="176" r="2.2" fill="#ffeec2"/>
  <circle cx="18" cy="100" r="2" fill="#ffc9dd"/>
  <circle cx="302" cy="100" r="2" fill="#b8f5e0"/>

  <!-- 작은 별 데코 -->
  <path d="M 50,46 L 52,50 L 57,50 L 53,53 L 55,58 L 50,55 L 45,58 L 47,53 L 43,50 L 48,50 Z" fill="#ffc9dd" opacity="0.7"/>
  <path d="M 272,148 L 274,152 L 279,152 L 275,155 L 277,160 L 272,157 L 267,160 L 269,155 L 265,152 L 270,152 Z" fill="#b8f5e0" opacity="0.7"/>

  <g filter="url(#lift)">
    <!-- 원탁 -->
    <ellipse cx="160" cy="150" rx="82" ry="26" fill="#fbf6ec" stroke="#e2cfa6" stroke-width="2"/>
    <ellipse cx="160" cy="147" rx="82" ry="26" fill="#fffdf7" stroke="#e8d9b6" stroke-width="1.4"/>

    <!-- 중앙: 엑스칼리버 (위로 세운 검) -->
    <g transform="translate(160, 30)">
      <!-- 칼날 -->
      <path d="M0 6 L6 14 L6 96 L0 106 L-6 96 L-6 14 Z" fill="url(#blade)" stroke="#a7b4c7" stroke-width="1.5"/>
      <path d="M0 6 L0 106" stroke="#dfe7f1" stroke-width="1.4"/>
      <!-- 가드(십자) -->
      <rect x="-24" y="96" width="48" height="9" rx="4.5" fill="#e0a92a" stroke="#b98518" stroke-width="1.4"/>
      <!-- 손잡이 -->
      <rect x="-4" y="105" width="8" height="24" rx="3" fill="#8a6f3a" stroke="#6d5628" stroke-width="1.2"/>
      <!-- 폼멜 (금 보석) -->
      <circle cx="0" cy="133" r="7" fill="#ffcf5c" stroke="#b98518" stroke-width="1.4"/>
      <circle cx="0" cy="133" r="2.6" fill="#fff3cf"/>
      <!-- 칼끝 반짝임 -->
      <path d="M-2 20 L2 20 L1 40 L-1 40 Z" fill="#ffffff" opacity="0.55"/>
    </g>

    <!-- 왕관 (검 위, 선을 상징) -->
    <g transform="translate(160, 22)">
      <path d="M-14 6 L-14 -4 L-7 2 L0 -8 L7 2 L14 -4 L14 6 Z" fill="#ffcf5c" stroke="#b98518" stroke-width="1.3"/>
      <rect x="-14" y="6" width="28" height="4" rx="1.5" fill="#b98518"/>
      <circle cx="0" cy="-8" r="2" fill="#ff8fb0"/>
    </g>

    <!-- 좌측 방패 (선 = 파랑 + 십자) -->
    <g transform="translate(52, 96) rotate(-10)">
      <path d="M0 0 L30 8 V30 Q30 48 15 58 Q0 48 0 30 Z" fill="#5b8dd6" stroke="#3a6aa8" stroke-width="2"/>
      <rect x="12" y="14" width="6" height="26" rx="2" fill="#eef4fb"/>
      <rect x="4" y="22" width="22" height="6" rx="2" fill="#eef4fb"/>
    </g>

    <!-- 우측 방패 (악 = 빨강 + 뿔) -->
    <g transform="translate(238, 96) rotate(10)">
      <path d="M0 0 L30 8 V30 Q30 48 15 58 Q0 48 0 30 Z" fill="#d05a52" stroke="#9c3f38" stroke-width="2"/>
      <path d="M15 16 L9 30 L15 26 L21 30 Z" fill="#ffd0cb"/>
      <circle cx="15" cy="38" r="3.4" fill="#2a1f28"/>
    </g>

    <!-- 원탁 위 퀘스트 토큰 (성공 ✓ / 실패 ✗) -->
    <g transform="translate(120, 148)">
      <circle cx="0" cy="0" r="10" fill="#2f9e6b" stroke="#217a51" stroke-width="1.4"/>
      <path d="M-4.5 0 L-1.5 3.5 L5 -4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(200, 150)">
      <circle cx="0" cy="0" r="10" fill="#d64545" stroke="#a83333" stroke-width="1.4"/>
      <path d="M-4 -4 L4 4 M4 -4 L-4 4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(160, 156)">
      <circle cx="0" cy="0" r="8" fill="#5b8dd6" stroke="#3a6aa8" stroke-width="1.3"/>
      <path d="M-3.5 0 L-1 2.8 L4 -3.2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
